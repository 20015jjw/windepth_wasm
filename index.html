<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>WinDepth 0.41 (WASM)</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #101418; color: #c8d0d8;
    font: 13px/1.5 system-ui, sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
  }
  canvas {
    /* Software rasterised at 512x384 and scaled by the browser with nearest
       neighbour, so the 1996 pixels stay pixels.  No WebGL anywhere. */
    image-rendering: pixelated;
    width: 1024px; height: 768px;
    max-width: 100vw; max-height: 75vh;
    background: #000;
    border: 1px solid #2a3239;
  }
  .keys { opacity: .75; }
  kbd {
    background: #1c2329; border: 1px solid #2f3942; border-radius: 3px;
    padding: 0 4px; font-family: inherit;
  }
  #status { min-height: 1.5em; }
</style>
</head>
<body>
<canvas id="screen" width="512" height="384"></canvas>
<div class="keys">
  <kbd>&larr;</kbd> <kbd>&rarr;</kbd> move &nbsp;
  <kbd>Z</kbd>/<kbd>Space</kbd> left charge &nbsp;
  <kbd>X</kbd>/<kbd>Enter</kbd> right charge &nbsp;
  <kbd>F2</kbd> start &nbsp; <kbd>Esc</kbd> title
</div>
<div id="status">loading…</div>

<script>
const PAD = { UP: 1, DOWN: 2, LEFT: 4, RIGHT: 8, BTN1: 0x10, BTN2: 0x20 };
const KEYMAP = {
  KeyK: PAD.UP,    ArrowUp: PAD.UP,    Numpad8: PAD.UP,
  KeyJ: PAD.DOWN,  ArrowDown: PAD.DOWN, Numpad2: PAD.DOWN,
  KeyH: PAD.LEFT,  ArrowLeft: PAD.LEFT, Numpad4: PAD.LEFT,
  KeyL: PAD.RIGHT, ArrowRight: PAD.RIGHT, Numpad6: PAD.RIGHT,
  KeyZ: PAD.BTN1,  Space: PAD.BTN1,
  KeyX: PAD.BTN2,  Enter: PAD.BTN2,
};
const SOUNDS = ['burn', 'start', 'eneshot', 'item', 'plane', 'drop'];

const cv = document.getElementById('screen');
const ctx = cv.getContext('2d', { alpha: false });
const status = document.getElementById('status');
let pad = 0;

// One decoded buffer per effect, cloned per play so overlapping hits work.
const audio = {};
let audioCtx = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  SOUNDS.forEach((name, i) => {
    fetch('data/' + name + '.wav')
      .then(r => r.arrayBuffer())
      .then(b => audioCtx.decodeAudioData(b))
      .then(buf => { audio[i] = buf; })
      .catch(() => {});
  });
}

var Module = {
  wdSound(slot) {
    if (!audioCtx || !audio[slot]) return;
    const src = audioCtx.createBufferSource();
    src.buffer = audio[slot];
    src.connect(audioCtx.destination);
    src.start();
  },
  onRuntimeInitialized() {
    if (Module._wd_init() !== 0) {
      status.textContent = 'failed to load the DAR archive';
      return;
    }
    const w = Module._wd_width(), h = Module._wd_height();
    const img = ctx.createImageData(w, h);
    status.textContent = 'press F2 to start';

    // 50ms, the same tick the original arms in FUN_00401cd0.
    setInterval(() => {
      Module._wd_tick(pad);
      const p = Module._wd_framebuffer();
      img.data.set(Module.HEAPU8.subarray(p, p + w * h * 4));
      ctx.putImageData(img, 0, 0);
    }, 50);
  }
};

addEventListener('keydown', e => {
  initAudio();
  if (e.code === 'F2') { Module._wd_start(); e.preventDefault(); return; }
  if (e.code === 'Escape') { Module._wd_title(); e.preventDefault(); return; }
  const bit = KEYMAP[e.code];
  if (bit) { pad |= bit; e.preventDefault(); }
});
addEventListener('keyup', e => {
  const bit = KEYMAP[e.code];
  if (bit) { pad &= ~bit; e.preventDefault(); }
});
cv.addEventListener('mousedown', initAudio);
</script>
<script src="windepth.js"></script>
</body>
</html>
